<div class="auth-container">
  <nz-card class="auth-card" [nzBordered]="false">
    <div class="auth-header">
      <h2 class="auth-title">🌍 TravelMate</h2>
      <p class="auth-subtitle">Sign in to your travel account</p>
    </div>

    @if (errorMessage()) {
      <nz-alert
        nzType="error"
        [nzMessage]="errorMessage()!"
        nzShowIcon
        class="auth-alert"
      ></nz-alert>
    }

    <form nz-form [formGroup]="loginForm" (ngSubmit)="onSubmit()" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired>Email</nz-form-label>
        <nz-form-control nzErrorTip="Please enter a valid email address!">
          <nz-input-group nzPrefixIcon="mail">
            <input type="email" nz-input formControlName="email" placeholder="you@example.com" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Password</nz-form-label>
        <nz-form-control nzErrorTip="Please enter your password!">
          <nz-input-group nzPrefixIcon="lock">
            <input type="password" nz-input formControlName="password" placeholder="••••••••" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <button
        nz-button
        nzType="primary"
        nzBlock
        nzSize="large"
        [nzLoading]="loading()"
        type="submit"
        class="auth-submit-btn"
      >
        Sign In
      </button>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/register">Create an account</a>
      </div>
    </form>
  </nz-card>
</div>

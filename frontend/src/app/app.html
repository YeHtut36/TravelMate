<nz-layout class="app-layout">
  <nz-header class="app-header">
    <div class="header-content">
      <a routerLink="/" class="brand-logo">
        🌍 <span class="brand-name">TravelMate</span>
      </a>

      <div class="nav-actions">
        @if (!authService.isAuthenticated()) {
          <a nz-button nzType="link" routerLink="/login">Sign In</a>
          <a nz-button nzType="primary" routerLink="/register">Register</a>
        } @else {
          <a nz-button nzType="link" routerLink="/dashboard">Dashboard</a>
        }
      </div>
    </div>
  </nz-header>

  <nz-content class="app-content">
    <router-outlet></router-outlet>
  </nz-content>
</nz-layout>
